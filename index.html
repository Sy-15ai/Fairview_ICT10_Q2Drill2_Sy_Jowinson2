<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Club Member Manager</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript -->
   <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #071e2d, #0b3d4f, #06151f);
            min-height: 100vh;
            color: #e8fbff;
            font-family: Arial, sans-serif;
        }

        .main-card {
            max-width: 850px;
            margin: 50px auto;
            padding: 35px;
            background: rgba(8, 30, 43, 0.92);
            border: 1px solid #20d9d2;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(32, 217, 210, 0.2);
        }

        .title {
            font-size: 34px;
            font-weight: bold;
            color: #54f5e9;
        }

        .subtitle {
            color: #9ccbd0;
        }

        .form-label {
            color: #b8eef0;
            font-weight: bold;
        }

        .form-control {
            background-color: #102f3c;
            color: white;
            border: 1px solid #28616b;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            background-color: #102f3c;
            color: white;
            border-color: #54f5e9;
            box-shadow: 0 0 10px rgba(84, 245, 233, 0.3);
        }

        .add-btn {
            background: #20d9d2;
            color: #062029;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #54f5e9;
        }

        .results {
            margin-top: 30px;
            padding: 22px;
            background: #09232f;
            border-radius: 15px;
            border-left: 4px solid #20d9d2;
        }

        .members {
            line-height: 1.8;
            color: #d5f7f8;
        }

        .total {
            color: #54f5e9;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="main-card">

            <h1 class="title">Club Member Manager</h1>

            <p class="subtitle">
                Add students and manage the club member list using Python sets.
            </p>

            <div class="row mt-4">

                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input
                        type="text"
                        id="first_name"
                        class="form-control"
                        placeholder="Enter first name"
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <input
                        type="text"
                        id="last_name"
                        class="form-control"
                        placeholder="Enter last name"
                    >
                </div>

            </div>

            <button
                class="btn add-btn w-100"
                py-click="add_member"
            >
                + Add Club Member
            </button>

            <div id="results" class="results">
                <h5>Member Directory</h5>
                <p class="subtitle">
                    Your club members will appear here.
                </p>
            </div>

        </div>
    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
